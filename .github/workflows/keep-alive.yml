name: DB Keep-Alive

on:
  schedule:
    # Every 5 days, well inside Atlas M0's 30-day auto-pause window
    - cron: '0 6 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping DB health endpoint
        run: |
          # --retry handles Render free-tier cold starts (up to ~50s)
          response=$(curl -sf --retry 3 --retry-delay 15 --max-time 60 \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            https://nexus-crm-backend-236b.onrender.com/api/health/db)
          echo "$response"
